services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Load the full repo-root .env (the file README's quickstart has you
    # create) into the API container: model providers, integrations, auth,
    # etc. `required: false` tolerates setups that export vars in the shell
    # and run `make docker` (the Makefile passes --env-file so ${VAR}
    # interpolation sees them) without a .env file.
    # NOTE: anything listed under `environment:` below SHADOWS the same key
    # from this env_file — keep that list to container-specific fixed paths.
    env_file:
      - path: ../.env
        required: false
    # Bound to loopback deliberately. The UI reaches the API over the compose
    # network (http://api:8000), so nothing needs the port on 0.0.0.0 — and
    # publishing it there puts an API whose shared-secret gate may be unset on
    # every interface of the host. Front it with a reverse proxy to expose it,
    # and set BACKEND_SHARED_SECRET + OE_PUBLIC_DEPLOYMENT when you do.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - VECTOR_STORE_PATH=/data/chroma_db
      - COMPANY_PROFILE_PATH=/data/company/profile.yaml
      - EPISODIC_DB_PATH=/data/episodic_memory.db
    # Bind the host's live state instead of a fresh named volume, so a local
    # `docker compose up` continues the SAME company you get from `make dev`
    # (profile, departments, Chroma index, episodic memory) rather than
    # booting an empty one that needs re-onboarding. Swap these for the named
    # volume below on a fresh machine or a real deployment.
    volumes:
      - ../company:/data/company
      - ../chroma_db:/data/chroma_db
      - ../packages/core/episodic_memory.db:/data/episodic_memory.db
      # - executive_data:/data
    healthcheck:
      # NOT `curl`: the image installs only `git` (see docker/Dockerfile), so a
      # curl-based check fails on every probe and the container never reports
      # healthy. `python:3.11-slim` guarantees an interpreter, and urllib exits
      # non-zero on any non-200, which is the semantics the check needs.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # The container builds the MCP tool-discovery index at boot; without a
      # grace period the first checks fail and it never reaches healthy.
      start_period: 5m
    # Restart on crash or exit. Without this a crashed API stays down until it
    # is started by hand, and the web proxy turns every request into
    # `TypeError: fetch failed` against a dead port.
    restart: unless-stopped

  mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp
    # Bound to loopback deliberately, same reasoning as the API: the MCP server
    # has no auth of its own and proxies with the backend's shared secret, so
    # publishing it on 0.0.0.0 would let anything that can reach the port act
    # on the company. Expose it through a reverse proxy if it must be remote.
    ports:
      - "127.0.0.1:8787:8787"
    # Deliberately NO env_file here: this container only makes outbound HTTP
    # calls with the shared secret. It has no business holding the Anthropic
    # key, bot tokens and IMAP credentials that the repo-root .env carries.
    environment:
      - BACKEND_BASE_URL=http://api:8000
      - BACKEND_SHARED_SECRET=${BACKEND_SHARED_SECRET:-}
      - MCP_PORT=8787
    depends_on:
      - api
    restart: unless-stopped

  web:
    # The SvelteKit app (packages/web) — the current UI. Runs the Vite dev
    # server against a bind mount, mirroring `make dev`'s behaviour and giving
    # hot reload without a rebuild. A production image needs @sveltejs/adapter-node
    # plus a real `vite build`; this service is for local development.
    image: oven/bun:1.4-alpine
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev --host 0.0.0.0 --port 5173"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../packages/web:/app
      # Keep the container's installed tree OFF the host. `bun install` inside a
      # bind-mounted packages/web would write Alpine/musl-native binaries over
      # the host's node_modules and break `bun run dev` on the host afterwards.
      - web_node_modules:/app/node_modules
    # The app's own env file carries DATABASE_URL (Neon), BETTER_AUTH_SECRET,
    # ORIGIN and the Google OAuth pair. Nothing here is duplicated into the
    # compose file, so secrets stay in one gitignored place.
    env_file:
      - path: ../packages/web/.env
        required: false
    # Anything listed here SHADOWS the same key from the env_file above — that
    # is deliberate for BACKEND_BASE_URL: inside the network, `localhost:8000`
    # is the web container itself, so the proxy and the roster guard would
    # both dial a dead port (the `fetch failed` 500s).
    environment:
      # Fixed to the compose service name, not the host.
      - BACKEND_BASE_URL=http://api:8000
      # Roster fallback for bootstrap, when the backend has no email-bearing
      # Person rows yet. Empty means "admit the first user".
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
    depends_on:
      # Wait for the API to actually answer, not merely to be started. With the
      # short form the web container boots immediately, dials a backend that is
      # still building its index, and the roster guard logs `fetch failed` for
      # the first minute or two of every start.
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Only used if you uncomment the named-volume line on the api service.
  executive_data:
    driver: local
  # Backs packages/web/node_modules inside the web container (see above).
  web_node_modules:
    driver: local
